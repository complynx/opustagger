name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Rust 1.97 and opus-tools
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install opus-tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends opus-tools

      - name: Install Rust 1.97
        run: >-
          rustup toolchain install 1.97.0 --profile minimal
          --component clippy --component rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run unit tests
        run: cargo test --locked

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build release binary
        run: cargo build --locked --release

      - name: Run opus-tools end-to-end tests
        env:
          OPUSTAGGER_BIN: target/release/opustagger
        run: sh tests/opustools-e2e.sh
